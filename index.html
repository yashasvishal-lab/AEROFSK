<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tonebridge — acoustic data link</title>
    <meta name="description" content="Tonebridge turns any two devices into an air-gapped data link that talks through sound: MFSK modulation, Reed-Solomon forward error correction and an authenticated encrypted channel. No server, no network." />
    <meta name="theme-color" content="#080b10" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; /* inline styles are needed for canvas layout; no untrusted CSS is ever interpreted */ img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tonebridge is a client-side DSP workstation and needs JavaScript enabled.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
